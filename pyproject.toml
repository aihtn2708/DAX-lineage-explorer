[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dax-lineage"
version = "0.1.0"
description = "Read DAX measure lineage from INFO.MEASURES() query output and draw it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
daxlin = "dax_lineage.cli:main"

[tool.setuptools]
packages = ["dax_lineage"]

[tool.setuptools.package-data]
dax_lineage = ["template.html", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
